name: Docker Pack Release

on:
  pull_request:
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
      - README.md
      - minecraft_server/**
  push:
    branches:
      - main
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate version and clean package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PACK_VERSION must contain a version in X.Y.Z format." >&2
            exit 1
          fi

          maintenance_version="$(
            tr -d '[:space:]' < minecraft_server/MAINTENANCE_IMAGE_VERSION
          )"

          if [[ ! "$maintenance_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MAINTENANCE_IMAGE_VERSION: $maintenance_version" >&2
            exit 1
          fi

          grep -Fq \
            "image: railsimulatornet/minecraft-maintenance:${maintenance_version}" \
            minecraft_server/docker-compose.yaml
          grep -Fq 'AUTOHEAL_IMAGE=railsimulatornet/autoheal:1.0.0' minecraft_server/.env

          bundle="UGREEN_Minecraft_Docker_Pack_v${version}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          unzip -t "dist/${asset}"

          if unzip -l "dist/${asset}" | grep -Fq 'Dockerfile.mc_maintenance'; then
            echo "The user package unexpectedly contains Dockerfile.mc_maintenance." >&2
            exit 1
          fi

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          tag="v${version}"
          publish=true

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            publish=false
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Build clean user package
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          bundle="UGREEN_Minecraft_Docker_Pack_v${VERSION}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          # The repository keeps the Dockerfile as the reproducible source for
          # railsimulatornet/minecraft-maintenance. The ready-to-use user bundle
          # pulls that image and therefore does not need local build sources.
          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          echo "ASSET=dist/${asset}" >> "$GITHUB_ENV"

      - name: Create bilingual release notes
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          maintenance_version="$(
            tr -d '[:space:]' < minecraft_server/MAINTENANCE_IMAGE_VERSION
          )"
          cat > release-notes.md <<EOF
          ## Deutsch

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Änderungen

          - neuer automatischer Bedrock-1.26-Kompatibilitätspatcher für Add-ons während der Installation
          - Backpacks-Fix: inkompatible Laufzeit-Imports aus \`@minecraft/server\` werden im temporären Staging bereinigt; dadurch wird unter anderem der Fehler um \`BlockComponentBlockBreakEvent\` behoben
          - Faramir's Furniture: gemischte \`render_method\`-Definitionen werden für aktuelle Bedrock-Versionen normalisiert
          - eingebettete VCS-Metadaten wie \`.git\` werden vor der Installation aus dem temporären Staging entfernt
          - Shell-Syntaxfehler im Add-on-Updater behoben
          - der Add-on-Updater überspringt bei fehlender \`lib_stack.sh\` nicht mehr still alle Welten, sondern verwendet integrierte Profil-Fallbacks
          - \`MC_SERVER_PROFILES\` wird explizit an den Maintenance-Container übergeben
          - Maintenance-Image bleibt unverändert auf \`railsimulatornet/minecraft-maintenance:${maintenance_version}\`
          - Autoheal bleibt unverändert auf \`railsimulatornet/autoheal:1.0.0\`

          Die Änderungen wurden mit Bedrock Dedicated Server 1.26.45.1 und dem aktuellen Survival-Add-on-Set getestet.

          Für vorhandene Installationen sollte die eigene produktive \`.env\` nicht vollständig überschrieben werden. Änderungen an \`docker-compose.yaml\` und den Maintenance-Skripten gezielt übernehmen.

          Das PDF-Handbuch bleibt als grundlegende Installationsanleitung unverändert. Aktuelle technische Details stehen in \`README.md\`, \`.env\` und \`docker-compose.yaml\`.

          Der zusätzliche ZIP-Download ist das bereinigte Benutzerpaket. Die im Repository weiterhin vorhandene \`Dockerfile.mc_maintenance\` dient ausschließlich als nachvollziehbare Build-Quelle für das veröffentlichte Maintenance-Image und ist im Benutzerpaket nicht enthalten.

          ## English

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Changes

          - new automatic Bedrock 1.26 add-on compatibility patcher during installation
          - Backpacks fix: incompatible runtime imports from \`@minecraft/server\` are cleaned in temporary staging, including the \`BlockComponentBlockBreakEvent\` compatibility failure
          - Faramir's Furniture: mixed \`render_method\` definitions are normalized for current Bedrock versions
          - embedded VCS metadata such as \`.git\` is removed from temporary staging before deployment
          - fixed the shell syntax error in the add-on updater
          - if \`lib_stack.sh\` is missing, the add-on updater no longer silently skips all worlds and instead uses built-in profile fallbacks
          - \`MC_SERVER_PROFILES\` is passed explicitly to the Maintenance container
          - Maintenance image remains unchanged at \`railsimulatornet/minecraft-maintenance:${maintenance_version}\`
          - Autoheal remains unchanged at \`railsimulatornet/autoheal:1.0.0\`

          The changes were tested with Bedrock Dedicated Server 1.26.45.1 and the current Survival add-on set.

          Existing customized production \`.env\` files should not be overwritten completely. Apply changes to \`docker-compose.yaml\` and the Maintenance scripts selectively.

          The PDF manual remains unchanged as the general installation guide. Current technical details are maintained in \`README.md\`, \`.env\` and \`docker-compose.yaml\`.

          The additional ZIP download is the clean user package. \`Dockerfile.mc_maintenance\` remains in the repository only as the reproducible build source for the published Maintenance image and is not included in the user package.
          EOF

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UGREEN Minecraft Docker Pack ${VERSION}" \
            --notes-file release-notes.md \
            --latest \
            "$ASSET"

      - name: Explain skipped release
        if: steps.release.outputs.publish != 'true'
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing was changed."
