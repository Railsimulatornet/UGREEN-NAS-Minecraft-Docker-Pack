name: Docker Pack Release

on:
  pull_request:
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
      - README.md
      - minecraft_server/**
  push:
    branches:
      - main
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate version and clean package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PACK_VERSION must contain a version in X.Y.Z format." >&2
            exit 1
          fi

          maintenance_version="$(
            tr -d '[:space:]' < minecraft_server/MAINTENANCE_IMAGE_VERSION
          )"

          if [[ ! "$maintenance_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MAINTENANCE_IMAGE_VERSION: $maintenance_version" >&2
            exit 1
          fi

          grep -Fq \
            "image: railsimulatornet/minecraft-maintenance:${maintenance_version}" \
            minecraft_server/docker-compose.yaml
          grep -Fq 'AUTOHEAL_IMAGE=railsimulatornet/autoheal:1.0.0' minecraft_server/.env

          bundle="UGREEN_Minecraft_Docker_Pack_v${version}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          unzip -t "dist/${asset}"

          if unzip -l "dist/${asset}" | grep -Fq 'Dockerfile.mc_maintenance'; then
            echo "The user package unexpectedly contains Dockerfile.mc_maintenance." >&2
            exit 1
          fi

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          tag="v${version}"
          publish=true

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            publish=false
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Build clean user package
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          bundle="UGREEN_Minecraft_Docker_Pack_v${VERSION}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          # The repository keeps the Dockerfile as the reproducible source for
          # railsimulatornet/minecraft-maintenance. The ready-to-use user bundle
          # pulls that image and therefore does not need local build sources.
          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          echo "ASSET=dist/${asset}" >> "$GITHUB_ENV"

      - name: Create bilingual release notes
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          maintenance_version="$(
            tr -d '[:space:]' < minecraft_server/MAINTENANCE_IMAGE_VERSION
          )"
          cat > release-notes.md <<EOF
          ## Deutsch

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Änderungen

          - Minecraft Bedrock 1.26.51.1 funktioniert jetzt mit NetherNet auf Creative und Survival, auch wenn Creative einen abweichenden Port wie 19133 verwendet.
          - Backups funktionieren wieder zuverlässig und verwenden den nativen Bedrockifier-Start.
          - Der tägliche Backup-Bericht erkennt Weltnamen mit Leerzeichen wie „Meine Welt“ korrekt.
          - Autoheal ist jetzt auf den Minecraft-Backup-Container begrenzt und greift nicht mehr auf andere Docker-Container des Hosts zu.
          - Kleinere Verbesserungen am Watchdog und am Backup-Report.

          Getestet mit Creative und Survival unter Bedrock Dedicated Server 1.26.51.1.

          Hinweis für bestehende Installationen: Die eigene .env nicht überschreiben. Änderungen an docker-compose.yaml und den Maintenance-Skripten gezielt übernehmen.

          ## English

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Changes

          - Minecraft Bedrock 1.26.51.1 now works with NetherNet on Creative and Survival, including Creative setups that use a different port such as 19133.
          - Backups are reliable again and use Bedrockifier's native startup.
          - The daily backup report now handles world names with spaces such as “Meine Welt” correctly.
          - Autoheal is now limited to the Minecraft backup container and no longer touches unrelated Docker containers on the host.
          - Minor improvements to the watchdog and backup report.

          Tested with Creative and Survival on Bedrock Dedicated Server 1.26.51.1.

          Note for existing installations: Do not overwrite your customized .env. Apply changes to docker-compose.yaml and the Maintenance scripts selectively.
          EOF

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UGREEN Minecraft Docker Pack ${VERSION}" \
            --notes-file release-notes.md \
            --latest \
            "$ASSET"

      - name: Explain skipped release
        if: steps.release.outputs.publish != 'true'
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing was changed."
