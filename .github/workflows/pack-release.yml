name: Docker Pack Release

on:
  pull_request:
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
      - README.md
      - minecraft_server/**
  push:
    branches:
      - main
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate version and clean package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PACK_VERSION must contain a version in X.Y.Z format." >&2
            exit 1
          fi

          grep -Fq 'image: railsimulatornet/minecraft-maintenance:1.0.1' minecraft_server/docker-compose.yaml
          grep -Fq 'AUTOHEAL_IMAGE=railsimulatornet/autoheal:1.0.0' minecraft_server/.env

          bundle="UGREEN_Minecraft_Docker_Pack_v${version}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          unzip -t "dist/${asset}"

          if unzip -l "dist/${asset}" | grep -Fq 'Dockerfile.mc_maintenance'; then
            echo "The user package unexpectedly contains Dockerfile.mc_maintenance." >&2
            exit 1
          fi

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          tag="v${version}"
          publish=true

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            publish=false
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Build clean user package
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          bundle="UGREEN_Minecraft_Docker_Pack_v${VERSION}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          # The repository keeps the Dockerfile as the reproducible source for
          # railsimulatornet/minecraft-maintenance. The ready-to-use user bundle
          # pulls that image and therefore does not need local build sources.
          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          echo "ASSET=dist/${asset}" >> "$GITHUB_ENV"

      - name: Create bilingual release notes
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## Deutsch

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Änderungen

          - Maintenance-Image auf \`railsimulatornet/minecraft-maintenance:1.0.1\` aktualisiert
          - Maintenance-Image mit aktuellen Alpine-3.24-Paketupdates neu gebaut
          - neuer Trivy-Sicherheitscheck vor der Veröffentlichung des Maintenance-Images
          - der veröffentlichte 1.0.1-Build hat den Security-Check ohne behebbare HIGH- oder CRITICAL-Funde bestanden
          - Multi-Arch-Unterstützung für \`linux/amd64\` und \`linux/arm64\` bleibt erhalten
          - SBOM und Build-Provenance bleiben für das Maintenance-Image aktiviert
          - Compose-Validierung prüft nun zusätzlich den festen Maintenance-Tag 1.0.1
          - Autoheal bleibt unverändert auf dem festen Tag \`railsimulatornet/autoheal:1.0.0\`

          Die eigentliche Minecraft-, Backup-, Watchdog- und Addon-Funktion wurde durch dieses Wartungs- und Sicherheitsupdate nicht verändert.

          Für vorhandene Installationen genügt es, die neue \`docker-compose.yaml\` zu übernehmen und die Images anschließend über Docker Compose neu zu ziehen und bereitzustellen. Die eigene produktive \`.env\` sollte nicht vollständig überschrieben werden.

          Das PDF-Handbuch bleibt als grundlegende Installationsanleitung unverändert. Aktuelle technische Details stehen in \`README.md\`, \`.env\` und \`docker-compose.yaml\`.

          Der zusätzliche ZIP-Download ist das bereinigte Benutzerpaket. Die im Repository weiterhin vorhandene \`Dockerfile.mc_maintenance\` dient ausschließlich als nachvollziehbare Build-Quelle für das veröffentlichte Maintenance-Image und ist im Benutzerpaket nicht enthalten.

          ## English

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Changes

          - maintenance image updated to \`railsimulatornet/minecraft-maintenance:1.0.1\`
          - maintenance image rebuilt with current Alpine 3.24 package updates
          - new Trivy security gate before publishing the maintenance image
          - the published 1.0.1 build passed the security gate with no fixable HIGH or CRITICAL findings
          - multi-architecture support for \`linux/amd64\` and \`linux/arm64\` remains available
          - SBOM and build provenance remain enabled for the maintenance image
          - Compose validation now also verifies the pinned maintenance tag 1.0.1
          - Autoheal remains unchanged on the pinned tag \`railsimulatornet/autoheal:1.0.0\`

          The actual Minecraft, backup, watchdog and addon functionality is unchanged by this maintenance and security update.

          Existing installations only need the new \`docker-compose.yaml\`, followed by pulling and redeploying the images through Docker Compose. Do not completely overwrite a customized production \`.env\`.

          The PDF manual remains unchanged as the general installation guide. Current technical details are maintained in \`README.md\`, \`.env\` and \`docker-compose.yaml\`.

          The additional ZIP download is the clean user package. \`Dockerfile.mc_maintenance\` remains in the repository only as the reproducible build source for the published Maintenance image and is not included in the user package.
          EOF

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UGREEN Minecraft Docker Pack ${VERSION}" \
            --notes-file release-notes.md \
            --latest \
            "$ASSET"

      - name: Explain skipped release
        if: steps.release.outputs.publish != 'true'
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing was changed."
