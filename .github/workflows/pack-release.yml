name: Docker Pack Release

on:
  pull_request:
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
      - README.md
      - minecraft_server/**
  push:
    branches:
      - main
    paths:
      - PACK_VERSION
      - .github/workflows/pack-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate version and clean package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PACK_VERSION must contain a version in X.Y.Z format." >&2
            exit 1
          fi

          maintenance_version="$(
            tr -d '[:space:]' < minecraft_server/MAINTENANCE_IMAGE_VERSION
          )"

          if [[ ! "$maintenance_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MAINTENANCE_IMAGE_VERSION: $maintenance_version" >&2
            exit 1
          fi

          grep -Fq \
            "image: railsimulatornet/minecraft-maintenance:${maintenance_version}" \
            minecraft_server/docker-compose.yaml
          grep -Fq 'AUTOHEAL_IMAGE=railsimulatornet/autoheal:1.0.0' minecraft_server/.env

          bundle="UGREEN_Minecraft_Docker_Pack_v${version}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          unzip -t "dist/${asset}"

          if unzip -l "dist/${asset}" | grep -Fq 'Dockerfile.mc_maintenance'; then
            echo "The user package unexpectedly contains Dockerfile.mc_maintenance." >&2
            exit 1
          fi

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          tag="v${version}"
          publish=true

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            publish=false
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Build clean user package
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          bundle="UGREEN_Minecraft_Docker_Pack_v${VERSION}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          # The repository keeps the Dockerfile as the reproducible source for
          # railsimulatornet/minecraft-maintenance. The ready-to-use user bundle
          # pulls that image and therefore does not need local build sources.
          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          echo "ASSET=dist/${asset}" >> "$GITHUB_ENV"

      - name: Create bilingual release notes
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          maintenance_version="$(
            tr -d '[:space:]' < minecraft_server/MAINTENANCE_IMAGE_VERSION
          )"
          cat > release-notes.md <<EOF
          ## Deutsch

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Änderungen

          - Der Add-on-Updater behandelt reine Zeitstempeländerungen nicht mehr als echtes Update.
          - Dadurch gibt es keine unnötigen Add-on-Mails und Minecraft-Neustarts mehr, wenn sich am Add-on-Inhalt nichts geändert hat.

          Getestet mit dem Backpacks-Add-on in zwei aufeinanderfolgenden Läufen ohne erkannte Änderungen.

          Hinweis für bestehende Installationen: Die eigene .env nicht überschreiben. Für diesen Fix reicht die aktualisierte maintenance/scripts/addons_update.sh.

          ## English

          UGREEN Minecraft Docker Pack ${VERSION}

          ### Changes

          - The add-on updater no longer treats timestamp-only differences as real updates.
          - This prevents unnecessary add-on emails and Minecraft restarts when the add-on content has not actually changed.

          Tested with the Backpacks add-on in two consecutive runs with no changes detected.

          Note for existing installations: Do not overwrite your customized .env. For this fix, updating maintenance/scripts/addons_update.sh is sufficient.
          EOF

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UGREEN Minecraft Docker Pack ${VERSION}" \
            --notes-file release-notes.md \
            --latest \
            "$ASSET"

      - name: Explain skipped release
        if: steps.release.outputs.publish != 'true'
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing was changed."
