name: Docker Pack Release

on:
  pull_request:
    paths:
      - PACK_VERSION
      - .github/release-title.txt
      - .github/release-notes.md
      - .github/workflows/pack-release.yml
      - README.md
      - minecraft_server/**
  push:
    branches:
      - main
    paths:
      - PACK_VERSION
      - .github/release-title.txt
      - .github/release-notes.md
      - .github/workflows/pack-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package_sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate version and clean package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PACK_VERSION must contain a version in X.Y.Z format." >&2
            exit 1
          fi

          title="$(tr -d '\r\n' < .github/release-title.txt)"
          expected_title="UGREEN Minecraft Docker Pack ${version}"

          if [[ "$title" != "$expected_title" ]]; then
            echo "Release title mismatch: expected '$expected_title', got '$title'." >&2
            exit 1
          fi

          if ! grep -Fq "UGREEN Minecraft Docker Pack ${version}" .github/release-notes.md; then
            echo "Release notes do not mention Docker Pack version ${version}." >&2
            exit 1
          fi

          maintenance_version="$(
            tr -d '[:space:]' < minecraft_server/MAINTENANCE_IMAGE_VERSION
          )"

          if [[ ! "$maintenance_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MAINTENANCE_IMAGE_VERSION: $maintenance_version" >&2
            exit 1
          fi

          grep -Fq \
            "image: railsimulatornet/minecraft-maintenance:latest" \
            minecraft_server/docker-compose.yaml
          grep -Fq 'AUTOHEAL_IMAGE=railsimulatornet/autoheal:1.0.0' minecraft_server/.env

          docker compose --env-file minecraft_server/.env -f minecraft_server/docker-compose.yaml config --quiet

          bundle="UGREEN_Minecraft_Docker_Pack_v${version}"
          asset="${bundle}.zip"

          mkdir -p "dist/${bundle}"
          cp -a README.md LICENSE minecraft_server "dist/${bundle}/"

          rm -f "dist/${bundle}/minecraft_server/Dockerfile.mc_maintenance"
          rm -f "dist/${bundle}/minecraft_server/MAINTENANCE_IMAGE_VERSION"

          shopt -s nullglob
          for file in *.pdf; do
            cp -a "$file" "dist/${bundle}/"
          done
          shopt -u nullglob

          if [[ -d assets ]]; then
            cp -a assets "dist/${bundle}/"
          fi

          (
            cd dist
            zip -r "$asset" "$bundle"
          )

          test -s "dist/${asset}"
          unzip -t "dist/${asset}"

          if unzip -l "dist/${asset}" | grep -Fq 'Dockerfile.mc_maintenance'; then
            echo "The user package unexpectedly contains Dockerfile.mc_maintenance." >&2
            exit 1
          fi
          digest="$(sha256sum "dist/${asset}")"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-docker-pack
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Railsimulatornet/UGREEN-NAS-Minecraft-Docker-Pack'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < PACK_VERSION)"
          tag="v${version}"
          publish=true

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            publish=false
          else
            rc=$?
            [[ "$rc" -eq 2 ]] || exit "$rc"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-docker-pack
          path: dist

      - name: Check release package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_SHA256: ${{ needs.validate.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          asset="dist/UGREEN_Minecraft_Docker_Pack_v${VERSION}.zip"
          test -s "$asset"
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$PACKAGE_SHA256" "$asset" | sha256sum --check --strict
          unzip -t "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Validate release metadata
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          title="$(tr -d '\r\n' < .github/release-title.txt)"
          expected_title="UGREEN Minecraft Docker Pack ${VERSION}"

          if [[ "$title" != "$expected_title" ]]; then
            echo "Release title mismatch: expected '$expected_title', got '$title'." >&2
            exit 1
          fi

          if ! grep -Fq "UGREEN Minecraft Docker Pack ${VERSION}" .github/release-notes.md; then
            echo "Release notes do not mention Docker Pack version ${VERSION}." >&2
            exit 1
          fi

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$(tr -d '\r\n' < .github/release-title.txt)" \
            --notes-file .github/release-notes.md \
            --latest \
            "$ASSET"

      - name: Explain skipped release
        if: steps.release.outputs.publish != 'true'
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing was changed."
