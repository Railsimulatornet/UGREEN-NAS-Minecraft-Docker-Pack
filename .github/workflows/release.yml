name: Release

on:
  pull_request:
    paths:
      - VERSION
      - .github/workflows/release.yml
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable semantic version such as 1.0.0." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release archive can be built
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          archive="UGREEN-NAS-Minecraft-Docker-Pack-${VERSION}.zip"
          git archive \
            --format=zip \
            --prefix="UGREEN-NAS-Minecraft-Docker-Pack-${VERSION}/" \
            --output="$archive" \
            HEAD

          test -s "$archive"
          sha256sum "$archive"

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build release archive
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          archive="UGREEN-NAS-Minecraft-Docker-Pack-${VERSION}.zip"
          git archive \
            --format=zip \
            --prefix="UGREEN-NAS-Minecraft-Docker-Pack-${VERSION}/" \
            --output="$archive" \
            HEAD

          sha256sum "$archive" > "${archive}.sha256"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi

          cat > release-notes.md <<EOF
          ## Deutsch

          Erster stabiler Release des UGREEN Minecraft Docker Packs.

          ### Enthalten

          - ein oder zwei Minecraft-Bedrock-Server über Compose-Profile
          - automatische Bedrockifier-Backups
          - Maintenance-Container mit Watchdog, Addon-Aktualisierung und Benachrichtigungen
          - festes Maintenance-Image \`railsimulatornet/minecraft-maintenance:1.0.0\`
          - festes Autoheal-Image \`railsimulatornet/autoheal:1.0.0\`
          - Autoheal-Cooldown und persistenter Schutz vor Neustartschleifen
          - korrigierter Backup-Healthcheck über TCP-Port 8080
          - SMTP- und Apprise-Unterstützung
          - deutsch- und englischsprachige Konfiguration und Dokumentation

          Für bestehende Installationen die eigene \`.env\` nicht vollständig überschreiben. Die neuen \`AUTOHEAL_*\`-Werte gezielt übernehmen und anschließend die aktualisierte \`docker-compose.yaml\` verwenden.

          Das PDF bleibt als grundlegende Installationsanleitung erhalten. Für den aktuellen technischen Stand sind \`README.md\`, \`minecraft_server/.env\` und \`minecraft_server/docker-compose.yaml\` maßgeblich.

          ## English

          First stable release of the UGREEN Minecraft Docker Pack.

          ### Included

          - one or two Minecraft Bedrock servers through Compose profiles
          - automatic Bedrockifier backups
          - maintenance container with watchdog checks, addon updates and notifications
          - pinned \`railsimulatornet/minecraft-maintenance:1.0.0\` image
          - pinned \`railsimulatornet/autoheal:1.0.0\` image
          - Autoheal cooldown and persistent restart-loop protection
          - corrected backup healthcheck through TCP port 8080
          - SMTP and Apprise support
          - German and English configuration and documentation

          Existing installations should not overwrite their customized \`.env\` file completely. Copy the new \`AUTOHEAL_*\` values as needed and then use the updated \`docker-compose.yaml\`.

          The PDF remains a general installation guide. The current technical configuration is documented in \`README.md\`, \`minecraft_server/.env\` and \`minecraft_server/docker-compose.yaml\`.
          EOF

          archive="UGREEN-NAS-Minecraft-Docker-Pack-${VERSION}.zip"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "UGREEN Minecraft Docker Pack ${VERSION}" \
            --notes-file release-notes.md \
            --latest \
            "$archive" \
            "${archive}.sha256"
