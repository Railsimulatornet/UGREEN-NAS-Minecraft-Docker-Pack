name: Minecraft Maintenance Image

on:
  pull_request:
    paths:
      - "minecraft_server/Dockerfile.mc_maintenance"
      - ".github/workflows/dockerhub-minecraft-maintenance.yml"
  push:
    branches:
      - main
    paths:
      - "minecraft_server/Dockerfile.mc_maintenance"
      - ".github/workflows/dockerhub-minecraft-maintenance.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version, for example 1.0.0"
        required: false
        default: ""
        type: string

env:
  IMAGE_NAME: railsimulatornet/minecraft-maintenance

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          tags="${IMAGE_NAME}:latest"

          if [[ -n "${VERSION}" ]]; then
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must use the format X.Y.Z, for example 1.0.0." >&2
              exit 1
            fi

            minor="${VERSION%.*}"
            tags+=$'\n'"${IMAGE_NAME}:${VERSION}"
            tags+=$'\n'"${IMAGE_NAME}:${minor}"
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./minecraft_server
          file: ./minecraft_server/Dockerfile.mc_maintenance
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
